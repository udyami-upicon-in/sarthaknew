<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Validate Certificate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .verify-icon {
      width: 72px;
      height: 72px;
      display: block;
      margin: 0 auto 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <form>
          <label for="certificate_no" class="form-label">Certificate Number</label>
          <div class="input-group">
            <input type="text" name="certificate_no" id="certificate_no" class="form-control"
              value="CMY5466666666666M"
              placeholder="Enter certificate number" required autocomplete="off">
            <button type="submit" class="btn btn-primary">Validate</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="certificateResultModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center pt-0">
          <svg class="verify-icon" viewBox="0 0 72 72" aria-label="Verified">
            <circle cx="36" cy="36" r="34" fill="#198754"/>
            <path d="M20 37.5 L31 48.5 L52 24" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p class="fw-bold text-success mb-3">Verified</p>
          <p class="mb-2"><strong>Name:</strong> Sarthak</p>
          <p class="mb-2"><strong>Father's Name:</strong> Donwlode</p>
          <p class="mb-2"><strong>Certificate No:</strong> CMY542252010298M</p>
          <p class="mb-0"><strong>Issue Date:</strong> 31 Oct 2026</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var resultModal = new bootstrap.Modal(document.getElementById('certificateResultModal'));
      resultModal.show();
    });
  </script>
</body>
</html>
